<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotoğraf Kaynakları / Photo Credits – Shuttle Travel</title>
  <meta name="description" content="Shuttle Travel uygulamasındaki lokasyon görsellerinin fotoğrafçı, lisans ve kaynak bilgileri. Photographer, license and source credits for location images in the Shuttle Travel app." />
  <link rel="canonical" href="https://shuttletravelapp.com/photo_references" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/shuttle_icon.svg">

  <style>
    :root {
      --p-900: #1a0f2e;
      --p-800: #211832;
      --p-700: #362656;
      --p-600: #4d2e83;
      --p-500: #5c3e94;
      --p-400: #6e51a9;
      --p-300: #c4b6ec;
      --p-200: #e3dcf5;
      --t-500: #00c2af;
      --t-400: #1ee3cf;
      --t-300: #b7f8ed;

      --page-bg:   #1a0f2e;
      --surface-2: #261a3e;
      --border:    rgba(255,255,255,0.08);
      --text:      rgba(255,255,255,0.88);
      --text-muted:rgba(255,255,255,0.48);
      --accent:    var(--t-400);
      --danger:    #ff6b6b;
      --success:   #1ee3cf;

      --radius-sm: 10px;
      --radius:    18px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.20), 0 4px 12px rgba(0,0,0,0.14);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.22), 0 2px 4px rgba(0,0,0,0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    :focus-visible {
      outline: 2px solid var(--t-400);
      outline-offset: 2px;
    }

    /* ── Top bar ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 72px;
      background: rgba(26,15,46,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-icon { width: 36px; height: 36px; }
    .brand-text { height: 20px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 16px; height: 16px; }

    .lang-toggle {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px;
      gap: 2px;
    }
    .lang-toggle button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 100px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      letter-spacing: 0.03em;
    }
    .lang-toggle button.on {
      background: var(--p-500);
      color: #fff;
    }

    /* ── Page header ── */
    .page-header {
      padding: 72px 24px 64px;
      text-align: center;
      background: linear-gradient(160deg, #261a3e 0%, #1a0f2e 60%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .page-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(92,62,148,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 50%, rgba(0,194,175,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .page-header .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(30,227,207,0.1);
      border: 1px solid rgba(30,227,207,0.2);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--t-400);
      margin-bottom: 20px;
      position: relative;
    }
    .page-header h1 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 12px;
      position: relative;
    }
    .page-header h1 span { color: var(--t-400); }
    .page-header .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Main content ── */
    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }

    /* ── Search ── */
    .search-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      scroll-margin-top: 96px;
    }
    .search-box {
      position: relative;
      flex: 1;
    }
    .search-box svg {
      position: absolute;
      left: 16px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-box input {
      width: 100%;
      background: rgba(0,0,0,0.25);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px 14px 46px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.32); }
    .search-box input:focus {
      border-color: var(--t-400);
      background: rgba(0,0,0,0.35);
    }
    .search-box input::-webkit-search-cancel-button { filter: invert(1) opacity(0.5); }

    .result-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--p-300);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* ── Credits list ── */
    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .credit-list {
      list-style: none;
      transition: opacity 0.2s;
    }
    .credit-list[aria-busy="true"] { opacity: 0.5; }

    .credit {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .credit:last-child { border-bottom: none; }

    .thumb {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: linear-gradient(135deg, var(--p-600) 0%, var(--t-500) 100%);
      border: 1px solid var(--border);
    }

    .credit-body { min-width: 0; flex: 1; }

    .credit-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      line-height: 1.4;
    }
    .credit-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .type-pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 10px;
      border-radius: 100px;
      background: rgba(92,62,148,0.3);
      border: 1px solid rgba(196,182,236,0.15);
      color: var(--p-300);
    }
    .type-pill.country {
      background: rgba(30,227,207,0.1);
      border-color: rgba(30,227,207,0.2);
      color: var(--t-400);
    }

    .credit-meta {
      margin-top: 4px;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }
    .credit-meta .author { color: var(--text); font-weight: 600; }
    .credit-meta .sep { margin: 0 6px; opacity: 0.6; }
    .credit-meta a {
      color: var(--t-400);
      text-decoration: none;
      font-weight: 600;
    }
    .credit-meta a:hover { text-decoration: underline; }
    .credit-meta a::after { content: '\00a0↗'; font-size: 11px; }

    /* skeleton */
    .credit.skeleton .thumb,
    .credit.skeleton .bar {
      background: rgba(255,255,255,0.06);
      border-color: transparent;
    }
    .credit.skeleton .bar {
      display: block;
      height: 12px;
      border-radius: 6px;
    }
    .credit.skeleton .bar + .bar { margin-top: 10px; }
    .credit.skeleton .thumb,
    .credit.skeleton .bar { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }

    /* empty / error */
    .state-box {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .state-box .state-text { margin-bottom: 16px; }
    .status {
      display: flex;
      margin: 20px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
    }
    .status.error {
      background: rgba(255,107,107,0.10);
      border: 1px solid rgba(255,107,107,0.30);
      color: var(--danger);
    }
    .status .icon { flex-shrink: 0; font-size: 16px; line-height: 1.4; }

    .ghost-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 20px;
      border-radius: 100px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .ghost-btn:hover { border-color: var(--t-400); color: var(--t-400); }

    /* ── Pagination ── */
    .pager {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .pager[hidden] { display: none; }
    .pager-track {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 4px;
      max-width: 100%;
    }
    .pager button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      background: none;
      border: none;
      border-radius: 100px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .pager button:hover:not(:disabled):not([aria-current]) { color: var(--t-400); }
    .pager button[aria-current="page"] {
      background: var(--p-500);
      color: #fff;
      cursor: default;
    }
    .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pager button svg { width: 16px; height: 16px; }
    .pager .step { padding: 0 16px; }
    .pager .gap {
      min-width: 24px;
      text-align: center;
      color: var(--text-muted);
      user-select: none;
    }
    .pager-info {
      font-size: 13px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Page footer ── */
    .page-footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 28px 24px;
      border-top: 1px solid var(--border);
      background: #0d0820;
    }
    .page-footer a { color: var(--p-300); text-decoration: none; }
    .page-footer a:hover { color: var(--t-400); }

    @media (max-width: 600px) {
      .top-bar { padding: 0 16px; }
      .page-header { padding: 56px 16px 48px; }
      .back-link span { display: none; }
      main { padding: 32px 16px 60px; }
      .search-row { flex-direction: column; align-items: stretch; gap: 8px; }
      .result-count { padding-left: 4px; }
      .credit { padding: 12px 14px; gap: 12px; align-items: flex-start; }
      .thumb { width: 48px; height: 48px; }
      .pager .step { padding: 0; min-width: 38px; }
      .pager .step-label { display: none; }
      .pager button { min-width: 34px; padding: 0 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
  <a href="/" class="nav-brand">
    <img class="brand-icon" src="/assets/shuttle_icon.svg" alt="">
    <img class="brand-text" src="/assets/shuttle_white_text.svg" alt="Shuttle">
  </a>

  <div class="lang-toggle">
    <button class="on" id="btn-tr" onclick="switchLang('tr')">TR</button>
    <button id="btn-en" onclick="switchLang('en')">EN</button>
  </div>

  <a href="/" class="back-link" id="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span id="back-text">Ana Sayfa</span>
  </a>
</header>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="eyebrow" id="header-eyebrow">📷 Fotoğraf Kaynakları</div>
  <h1 id="header-title">Fotoğraf <span>Kaynakları</span></h1>
  <div class="subtitle" id="header-subtitle">Uygulamadaki lokasyon görselleri Wikimedia Commons'tan alınmıştır. Bazı görseller kırpılmış veya yeniden boyutlandırılmıştır.</div>
</div>

<main>

  <div class="search-row" id="search-row">
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="search-input" placeholder="Yer ara..." autocomplete="off" spellcheck="false" aria-label="Yer ara">
    </label>
    <div class="result-count" id="result-count" aria-live="polite"></div>
  </div>

  <div class="card">
    <ul class="credit-list" id="credit-list" aria-busy="true"></ul>
    <div id="state-box"></div>
  </div>

  <nav class="pager" id="pager" aria-label="Sayfalama" hidden>
    <div class="pager-track" id="pager-track"></div>
    <div class="pager-info" id="pager-info"></div>
  </nav>

</main>

<footer class="page-footer">
  <p>&copy; 2026 Shuttle Travel &nbsp;·&nbsp; <a href="mailto:info@shuttletravelapp.com">info@shuttletravelapp.com</a></p>
  <p style="margin-top:8px;"><a href="/" id="footer-back">← Ana Sayfaya Dön</a></p>
</footer>

<script>
  const strings = {
    tr: {
      docTitle:   'Fotoğraf Kaynakları – Shuttle Travel',
      eyebrow:    '📷 Fotoğraf Kaynakları',
      title:      'Fotoğraf <span>Kaynakları</span>',
      subtitle:   "Uygulamadaki lokasyon görselleri Wikimedia Commons'tan alınmıştır. Bazı görseller kırpılmış veya yeniden boyutlandırılmıştır.",
      back:       'Ana Sayfa',
      footerBack: '← Ana Sayfaya Dön',
      search:     'Yer ara...',
      count:      (n) => n + ' görsel',
      types:      { Country: 'Ülke', State: 'Eyalet', City: 'Şehir' },
      photo:      'Fotoğraf',
      source:     'Wikimedia Commons',
      empty:      (q) => '“' + q + '” için sonuç bulunamadı.',
      emptyAll:   'Henüz listelenecek görsel yok.',
      clear:      'Aramayı temizle',
      error:      'Fotoğraf kaynakları yüklenemedi. Bağlantınızı kontrol edip tekrar deneyin.',
      rateLimit:  'Çok fazla istek gönderildi. Birkaç saniye sonra tekrar deneyin.',
      retry:      'Tekrar dene',
      pagination: 'Sayfalama',
      prev:       'Önceki',
      next:       'Sonraki',
      pageLabel:  (p) => 'Sayfa ' + p,
      pageInfo:   (p, t) => 'Sayfa ' + p + ' / ' + t
    },
    en: {
      docTitle:   'Photo Credits – Shuttle Travel',
      eyebrow:    '📷 Photo Credits',
      title:      'Photo <span>Credits</span>',
      subtitle:   'Location images in the app are sourced from Wikimedia Commons. Some images have been cropped or resized.',
      back:       'Home',
      footerBack: '← Back to Home',
      search:     'Search places...',
      count:      (n) => n + ' images',
      types:      { Country: 'Country', State: 'State', City: 'City' },
      photo:      'Photo',
      source:     'Wikimedia Commons',
      empty:      (q) => 'No results for “' + q + '”.',
      emptyAll:   'No images to list yet.',
      clear:      'Clear search',
      error:      'Photo credits could not be loaded. Check your connection and try again.',
      rateLimit:  'Too many requests. Try again in a few seconds.',
      retry:      'Try again',
      pagination: 'Pagination',
      prev:       'Previous',
      next:       'Next',
      pageLabel:  (p) => 'Page ' + p,
      pageInfo:   (p, t) => 'Page ' + p + ' of ' + t
    }
  };

  const IS_LOCAL = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const API_URL = IS_LOCAL
    ? 'https://test.shuttletravelapp.com/exapi/location/image_credits'
    : 'https://api.shuttletravelapp.com/exapi/location/image_credits';
  const PAGE_SIZE = 50;
  const SEARCH_DELAY = 300;

  const listEl    = document.getElementById('credit-list');
  const stateEl   = document.getElementById('state-box');
  const countEl   = document.getElementById('result-count');
  const searchEl  = document.getElementById('search-input');
  const pagerEl   = document.getElementById('pager');
  const trackEl   = document.getElementById('pager-track');
  const infoEl    = document.getElementById('pager-info');
  const searchRow = document.getElementById('search-row');
  const mobileMq  = window.matchMedia('(max-width: 600px)');
  const reduceMq  = window.matchMedia('(prefers-reduced-motion: reduce)');

  function initialLang() {
    const saved = localStorage.getItem('shuttle_lang');
    if (saved === 'tr' || saved === 'en') return saved;
    return (navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en';
  }

  function readUrl() {
    const params = new URLSearchParams(location.search);
    const page = parseInt(params.get('page'), 10);
    return {
      page: Number.isFinite(page) && page > 0 ? page : 1,
      search: params.get('search') || ''
    };
  }

  const state = { ...readUrl(), lang: initialLang(), data: null, error: null };
  let controller = null;
  let searchTimer = null;

  function writeUrl(replace) {
    const params = new URLSearchParams();
    if (state.page > 1) params.set('page', state.page);
    if (state.search.trim()) params.set('search', state.search.trim());
    const qs = params.toString();
    const url = location.pathname + (qs ? '?' + qs : '');
    if (url === location.pathname + location.search) return;
    history[replace ? 'replaceState' : 'pushState'](null, '', url);
  }

  async function loadPhotoReferences({ page, search, locale, signal }) {
    const params = new URLSearchParams({ page, page_size: PAGE_SIZE, locale });
    if (search.trim()) params.set('search', search.trim());

    const res = await fetch(`${API_URL}?${params}`, { signal, headers: { 'Accept': 'application/json' } });
    if (res.status === 429) {
      const err = new Error('rate_limit');
      err.rateLimited = true;
      throw err;
    }
    const body = await res.json();
    if (!res.ok || !body.success) throw new Error(body.message || `HTTP ${res.status}`);
    return body.data; // { items, page, page_size, total_count, total_pages, has_next }
  }

  async function load() {
    if (controller) controller.abort();
    controller = new AbortController();
    const { signal } = controller;

    state.error = null;
    listEl.setAttribute('aria-busy', 'true');
    if (!state.data) renderSkeleton();

    try {
      const data = await loadPhotoReferences({
        page: state.page,
        search: state.search,
        locale: state.lang,
        signal
      });
      if (signal.aborted) return;

      // Requested past the last page (e.g. stale shared link): jump to the last one.
      if (!data.items.length && data.total_pages > 0 && state.page > data.total_pages) {
        state.page = data.total_pages;
        writeUrl(true);
        return load();
      }

      state.data = data;
      if (data.page !== state.page) {
        state.page = data.page;
        writeUrl(true);
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      state.data = null;
      state.error = err.rateLimited ? 'rateLimit' : 'error';
    }
    listEl.setAttribute('aria-busy', 'false');
    render();
  }

  // ── Rendering ──

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function safeUrl(value) {
    return typeof value === 'string' && /^https?:\/\//i.test(value) ? value : null;
  }

  function extLink(href, text) {
    const a = el('a', '', text);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    return a;
  }

  function renderSkeleton() {
    listEl.replaceChildren();
    stateEl.replaceChildren();
    for (let i = 0; i < 8; i++) {
      const li = el('li', 'credit skeleton');
      li.setAttribute('aria-hidden', 'true');
      const body = el('div', 'credit-body');
      const b1 = el('span', 'bar'); b1.style.width = (30 + (i * 17) % 30) + '%';
      const b2 = el('span', 'bar'); b2.style.width = (55 + (i * 23) % 35) + '%';
      body.append(b1, b2);
      li.append(el('div', 'thumb'), body);
      listEl.appendChild(li);
    }
  }

  function renderItem(item, s) {
    const li = el('li', 'credit');

    const imgSrc = safeUrl(item.image_url);
    const img = el('img', 'thumb');
    img.alt = '';
    img.width = 56;
    img.height = 56;
    img.loading = 'lazy';
    img.decoding = 'async';
    if (imgSrc) {
      img.src = imgSrc;
      img.onerror = () => img.removeAttribute('src');
    }

    const body = el('div', 'credit-body');

    const title = el('div', 'credit-title');
    title.appendChild(el('span', 'credit-name', item.name));
    if (s.types[item.type]) {
      title.appendChild(el('span', 'type-pill' + (item.type === 'Country' ? ' country' : ''), s.types[item.type]));
    }

    const meta = el('div', 'credit-meta');
    const author = el('span', 'author', '📷 ' + (item.author || '—'));
    author.title = s.photo;
    meta.appendChild(author);

    if (item.license) {
      meta.appendChild(el('span', 'sep', '·'));
      const licenseHref = safeUrl(item.license_url);
      meta.appendChild(licenseHref ? extLink(licenseHref, item.license) : el('span', '', item.license));
    }

    const sourceHref = safeUrl(item.source_url);
    if (sourceHref) {
      meta.appendChild(el('span', 'sep', '·'));
      meta.appendChild(extLink(sourceHref, s.source));
    }

    body.append(title, meta);
    li.append(img, body);
    return li;
  }

  function renderStateBox(kind, s) {
    stateEl.replaceChildren();
    if (!kind) return;
    const box = el('div', 'state-box');

    if (kind === 'empty') {
      const q = state.search.trim();
      box.appendChild(el('p', 'state-text', q ? s.empty(q) : s.emptyAll));
      if (q) {
        const btn = el('button', 'ghost-btn', s.clear);
        btn.type = 'button';
        btn.onclick = () => {
          searchEl.value = '';
          setSearch('');
          searchEl.focus();
        };
        box.appendChild(btn);
      }
    } else {
      const status = el('div', 'status error');
      status.setAttribute('role', 'alert');
      status.append(el('span', 'icon', '✕'), el('span', '', s[kind]));
      const btn = el('button', 'ghost-btn', s.retry);
      btn.type = 'button';
      btn.onclick = load;
      box.style.padding = '8px 0 28px';
      box.append(status, btn);
    }
    stateEl.appendChild(box);
  }

  // Page numbers to show: first, last and current ±radius, with null marking a gap.
  // A gap that would hide a single page shows that page instead.
  function pageWindow(current, total, radius) {
    const pages = new Set([1, total]);
    for (let p = current - radius; p <= current + radius; p++) {
      if (p >= 1 && p <= total) pages.add(p);
    }
    const sorted = [...pages].sort((a, b) => a - b);
    const out = [];
    sorted.forEach((p, i) => {
      const prev = sorted[i - 1];
      if (prev != null) {
        if (p - prev === 2) out.push(prev + 1);
        else if (p - prev > 2) out.push(null);
      }
      out.push(p);
    });
    return out;
  }

  function chevron(dir) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2.5');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    const line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', dir === 'prev' ? '15 18 9 12 15 6' : '9 18 15 12 9 6');
    svg.appendChild(line);
    return svg;
  }

  function renderPager(s) {
    const data = state.data;
    trackEl.replaceChildren();
    pagerEl.setAttribute('aria-label', s.pagination);

    if (!data || data.total_pages <= 1) {
      pagerEl.hidden = true;
      return;
    }
    pagerEl.hidden = false;

    const current = data.page;
    const total = data.total_pages;

    const stepBtn = (dir) => {
      const btn = el('button', 'step');
      btn.type = 'button';
      const label = el('span', 'step-label', dir === 'prev' ? s.prev : s.next);
      btn.setAttribute('aria-label', dir === 'prev' ? s.prev : s.next);
      if (dir === 'prev') btn.append(chevron('prev'), label);
      else btn.append(label, chevron('next'));
      const target = dir === 'prev' ? current - 1 : current + 1;
      btn.disabled = dir === 'prev' ? current <= 1 : !data.has_next;
      btn.onclick = () => goToPage(target);
      return btn;
    };

    trackEl.appendChild(stepBtn('prev'));

    pageWindow(current, total, mobileMq.matches ? 0 : 1).forEach((p) => {
      if (p === null) {
        const gap = el('span', 'gap', '…');
        gap.setAttribute('aria-hidden', 'true');
        trackEl.appendChild(gap);
        return;
      }
      const btn = el('button', '', String(p));
      btn.type = 'button';
      btn.setAttribute('aria-label', s.pageLabel(p));
      if (p === current) btn.setAttribute('aria-current', 'page');
      else btn.onclick = () => goToPage(p);
      trackEl.appendChild(btn);
    });

    trackEl.appendChild(stepBtn('next'));
    infoEl.textContent = s.pageInfo(current, total);
  }

  function render() {
    const s = strings[state.lang];
    const data = state.data;
    const nf = new Intl.NumberFormat(state.lang === 'tr' ? 'tr-TR' : 'en-US');

    listEl.replaceChildren();
    if (data) data.items.forEach((item) => listEl.appendChild(renderItem(item, s)));

    countEl.textContent = data ? s.count(nf.format(data.total_count)) : '';
    renderStateBox(state.error || (data && !data.items.length ? 'empty' : null), s);
    renderPager(s);
  }

  // ── Interactions ──

  function goToPage(page) {
    if (!state.data || page < 1 || page > state.data.total_pages || page === state.page) return;
    state.page = page;
    writeUrl(false);
    searchRow.scrollIntoView({ behavior: reduceMq.matches ? 'auto' : 'smooth', block: 'start' });
    load();
  }

  function setSearch(value) {
    clearTimeout(searchTimer);
    if (value.trim() === state.search.trim()) return;
    const isNewSearch = !state.search.trim();
    state.search = value;
    state.page = 1;
    // One history entry per search session, not one per keystroke.
    writeUrl(!isNewSearch);
    load();
  }

  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const value = searchEl.value;
    searchTimer = setTimeout(() => setSearch(value), SEARCH_DELAY);
  });

  window.addEventListener('popstate', () => {
    clearTimeout(searchTimer);
    Object.assign(state, readUrl());
    searchEl.value = state.search;
    load();
  });

  mobileMq.addEventListener('change', () => renderPager(strings[state.lang]));

  function switchLang(lang) {
    const changed = lang !== state.lang;
    state.lang = lang;
    localStorage.setItem('shuttle_lang', lang);

    document.getElementById('btn-tr').classList.toggle('on', lang === 'tr');
    document.getElementById('btn-en').classList.toggle('on', lang === 'en');
    document.documentElement.lang = lang;

    const s = strings[lang];
    document.title = s.docTitle;
    document.getElementById('header-eyebrow').textContent = s.eyebrow;
    document.getElementById('header-title').innerHTML = s.title;
    document.getElementById('header-subtitle').textContent = s.subtitle;
    document.getElementById('back-text').textContent = s.back;
    document.getElementById('footer-back').textContent = s.footerBack;
    searchEl.placeholder = s.search;
    searchEl.setAttribute('aria-label', s.search.replace(/\.+$/, ''));

    // Place names are localized by the API, so a language change needs a refetch.
    if (changed) load();
  }

  searchEl.value = state.search;
  switchLang(state.lang);
  load();
</script>

</body>
</html>
